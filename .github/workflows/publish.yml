# Publishing a stable GitHub Release is the only deployment trigger.
#
# npm Trusted Publishing must authorize this repository and the workflow file
# `publish.yml`. The job uses GitHub OIDC, so no long-lived npm token is needed.

name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # A prerelease needs an explicit npm dist-tag policy; do not publish it as
    # `latest` accidentally.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org/'

      - name: Fetch current main
        run: git fetch --no-tags origin main

      - name: Verify the stable release target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '$RELEASE_TAG' must use the stable v<major>.<minor>.<patch> format." >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"

          if [[ "$TAG_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match the checked-out commit." >&2
            exit 1
          fi

          if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
            echo "Release tag '$RELEASE_TAG' must point to the current main commit, not an older ancestor." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Run the full package test suite
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high

      - name: Report n8n Cloud support
        run: pnpm exec n8n-node cloud-support

      - name: Publish package
        # The guarded package script delegates to n8n-node's GitHub Actions
        # path, which rebuilds and publishes with provenance.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm release
