# Publishing a stable GitHub Release is the only deployment trigger.
#
# npm Trusted Publishing must authorize this repository and the workflow file
# `publish.yml`. The job uses GitHub OIDC, so no long-lived npm token is needed.

name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # A prerelease needs an explicit npm dist-tag policy; do not publish it as
    # `latest` accidentally.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify the stable release target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '$RELEASE_TAG' must use the stable v<major>.<minor>.<patch> format." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag '$RELEASE_TAG' must point to a commit on main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare npm package metadata
        run: node .github/scripts/prepare-npm-release.mjs

      - name: Publish package
        # The preparation step derives the package version and npm-visible
        # README notes from the published GitHub Release. In GitHub Actions,
        # n8n-node release then lints, builds, and publishes with provenance.
        run: pnpm release
