# Publishing a stable GitHub Release is the only deployment trigger.
#
# npm Trusted Publishing must authorize this repository and the workflow file
# `publish.yml`. The job uses GitHub OIDC, so no long-lived npm token is needed.

name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # A prerelease needs an explicit npm dist-tag policy; do not publish it as
    # `latest` accidentally.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag '$RELEASE_TAG' must match package version '$PACKAGE_VERSION' as '$EXPECTED_TAG'." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish package
        # In GitHub Actions, n8n-node release runs lint and build, then calls
        # npm publish with provenance enabled. It does not bump, tag, or create
        # another GitHub Release.
        run: pnpm release
