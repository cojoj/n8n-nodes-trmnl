name: Latest n8n Runtime and Tooling Compatibility

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-runtime-tooling-compatibility
  cancel-in-progress: true

jobs:
  latest-n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Update n8n runtime and tooling in the runner
        run: pnpm update --latest n8n-workflow @n8n/node-cli

      - name: Test against the latest n8n tooling
        run: pnpm test

      - name: Lint against the latest n8n tooling
        run: pnpm lint

      - name: Check n8n Cloud support
        run: pnpm exec n8n-node cloud-support

      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high
