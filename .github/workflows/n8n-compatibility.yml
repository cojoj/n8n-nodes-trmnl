name: Latest n8n Compatibility

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-compatibility
  cancel-in-progress: true

jobs:
  latest-node-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Update n8n tooling in the runner
        run: pnpm update --latest @n8n/node-cli

      - name: Test against the latest n8n tooling
        run: pnpm test
