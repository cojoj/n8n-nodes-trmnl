name: Latest n8n Runtime and Tooling Compatibility

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-runtime-tooling-compatibility
  cancel-in-progress: true

jobs:
  latest-n8n:
    name: Latest n8n on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts/*', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Update n8n runtime and tooling in the runner
        run: pnpm update --latest n8n-workflow @n8n/node-cli

      - name: Test against the latest n8n tooling
        run: pnpm test

      - name: Lint against the latest n8n tooling
        run: pnpm lint

      - name: Check n8n Cloud support
        run: pnpm exec n8n-node cloud-support
