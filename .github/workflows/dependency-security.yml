name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest-n8n]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Validate the committed lockfile
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: Resolve the latest n8n runtime and tooling
        if: matrix.dependencies == 'latest-n8n'
        run: pnpm update --latest n8n-workflow @n8n/node-cli --lockfile-only --ignore-scripts

      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high
